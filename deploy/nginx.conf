# D全屋家居 生产 Nginx 配置（对齐 PRD D9 / 技术文档 §7 部署）
# 职责：①前台/后台静态托管（构建产物）②/api 反代后端 ③/uploads 图片直出（ADR-003）
# 使用：放入 /etc/nginx/conf.d/d-home.conf（替换 server_name 为正式域名）
server {
    listen 80;
    server_name localhost;   # 正式上线替换为域名（如 www.example.com）

    # 上传大小限制（后端也有 5MB 校验，这里前置拦截）
    client_max_body_size 10m;

    # ---------- 前台官网（frontend/dist 构建产物，HashRouter 无需 try_files 兜底） ----------
    location / {
        root /opt/d-home/frontend/dist;
        index index.html;
    }

    # ---------- 后台管理（admin/dist 构建产物） ----------
    location /admin {
        alias /opt/d-home/admin/dist/;
        index index.html;
    }

    # ---------- 后端 API 反代（uvicorn 127.0.0.1:8000） ----------
    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- 图片静态直出（backend/uploads，DB 只存相对路径） ----------
    location /uploads {
        alias /opt/d-home/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# HTTPS 接入建议（D9：开发/验收用 Let's Encrypt 免费证书；正式域名由用户提供）
